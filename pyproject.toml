[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mcubin"
version = "0.1.0"
description = "Desktop inventory system for electronic parts"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "Pillow>=10.0",
    "PySide6>=6.6",
    "python-barcode>=0.15",
    "qt-material>=2.14",
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "zplgrf>=1.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mcubin*"]
